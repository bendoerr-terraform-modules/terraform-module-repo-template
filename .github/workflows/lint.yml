# Thin caller -> reusable lint in bendoerr-terraform-modules/workflows (SHA-pinned, big-blast).
# Full TF-module set. Baseline pins tflint_version v0.49.0 + the markdownlint_flags disable-set == reusable defaults -> pure defaults, no overrides.
# egress uses reusable default (superset of this repo's set -> behavior-preserving). Lint isn't a
# required check -> rename cosmetic; proof is the fidelity-diff vs this repo's last per-repo run.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: bendoerr-terraform-modules/workflows/.github/workflows/lint.yml@93e740f8fea20eda37207f4afd2908325972851e # v1.2.7

  paperwork:
    # Tripwire for repos born from the template: fails until the new-repo checklist
    # (top of README.md) is completed. Skipped in the template itself.
    if: github.repository != 'bendoerr-terraform-modules/terraform-module-repo-template'
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Scan for template paperwork (the scanner must be able to look)"
        id: scan
        env:
          PAPERWORK_FINDINGS: ${{ runner.temp }}/paperwork-findings.txt
        run: |
          # GitHub runs `run:` steps with `bash -eo pipefail {0}` unless a shell is declared,
          # and `set -uo pipefail` does NOT clear an inherited `-e`. With a bare `cmd; rc=$?` the
          # step dies on the scanner's rc=1 BEFORE the capture, so a real finding would red THIS
          # step - "could not look" - and skip the evaluator entirely. That is the exact confusion
          # the split exists to remove, and it lands on the COMMON case. `|| rc=$?` is `-e`-safe.
          set -uo pipefail
          rc=0
          .github/scripts/paperwork-check.sh || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Enumerate the WHOLE space, never the complement of one value. A missing or
          # non-executable script returns 127, and `[ "$rc" -ne 2 ]` would let that exit 0 -
          # the gate would go green with no script at all.
          case "$rc" in
            0 | 1) exit 0 ;;
            2) echo "::error::the paperwork scanner could not look; this is NOT a clean result"; exit 1 ;;
            *) echo "::error::paperwork scanner exited $rc - it did not run (missing? not executable?)"; exit 1 ;;
          esac
      - name: "Template paperwork done?"
        if: steps.scan.outputs.rc == '0' || steps.scan.outputs.rc == '1'
        env:
          PAPERWORK_FINDINGS: ${{ runner.temp }}/paperwork-findings.txt
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          set -uo pipefail
          # THE HANDOFF IS ASSERTED, NOT TRUSTED. A scanner that greens without writing its
          # paperwork hands this step nothing, and green + green is the hole. Both halves would
          # now have to lie in agreement.
          if [ ! -f "$PAPERWORK_FINDINGS" ]; then
            echo "::error::scanner exited $RC but wrote no findings file - the handoff is broken"
            exit 1
          fi
          if [ "$RC" = "0" ] && [ -s "$PAPERWORK_FINDINGS" ]; then
            echo "::error::scanner reported CLEAN but the findings file is non-empty - contradictory"
            exit 1
          fi
          if [ "$RC" = "1" ]; then
            if [ ! -s "$PAPERWORK_FINDINGS" ]; then
              echo "::error::scanner reported FINDINGS but the findings file is empty - contradictory"
              exit 1
            fi
            echo "::error::template paperwork is incomplete - complete the new-repo checklist at the top of terraform-module-repo-template's README"
            cat "$PAPERWORK_FINDINGS"
            exit 1
          fi
          echo "paperwork verified: scanner reported CLEAN and the findings file is empty"

  paperwork-selftest:
    # NO `if:` - this runs in the template too, which is the entire point. The paperwork job above
    # is skipped here, so without this the gate's logic is never executed in the repo that owns it,
    # and a skipped job reports as `skipped`, which every green-check reading treats as non-failing.
    # A fixture is not the repo it runs in.
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Paperwork gate honours its exit contract"
        run: .github/scripts/paperwork-selftest.sh
      - name: "The .github exclusion still holds (the scripts must not match themselves)"
        run: |
          set -uo pipefail
          # LOAD-BEARING: paperwork-check.sh contains the needles it searches for, and is safe only
          # because ':!.github' excludes it. If that ever stops being true the gate matches its own
          # definition and fails forever. This was a stated constraint with nothing verifying it.
          hits=$(git grep -l 'TEMPLATE_TODO_' -- ':!.github' | grep '^\.github/' | grep -c . || true)
          if [ "$hits" -ne 0 ]; then
            echo "::error::the ':!.github' exclusion no longer holds - the paperwork scripts are inside their own search scope"
            git grep -l 'TEMPLATE_TODO_' -- ':!.github' | grep '^\.github/'
            exit 1
          fi
          echo "exclusion holds: no .github/ path is inside the gate's own scope"
