# Thin caller -> reusable lint in bendoerr-terraform-modules/workflows (SHA-pinned, big-blast).
# Full TF-module set. Baseline pins tflint_version v0.49.0 + the markdownlint_flags disable-set == reusable defaults -> pure defaults, no overrides.
# egress uses reusable default (superset of this repo's set -> behavior-preserving). Lint isn't a
# required check -> rename cosmetic; proof is the fidelity-diff vs this repo's last per-repo run.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: bendoerr-terraform-modules/workflows/.github/workflows/lint.yml@93e740f8fea20eda37207f4afd2908325972851e # v1.2.7

  paperwork:
    # Tripwire for repos born from the template: fails until the new-repo checklist
    # (top of README.md) is completed. Skipped in the template itself.
    if: github.repository != 'bendoerr-terraform-modules/terraform-module-repo-template'
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Template paperwork done?"
        run: |
          set -euo pipefail
          fail=0
          todos=$(git grep -n 'TEMPLATE_TODO_' -- ':!.github' || true)
          if [ -n "$todos" ]; then
            echo "::error::unfilled template placeholders remain"; echo "$todos"; fail=1
          fi
          selfrefs=$(git grep -n 'repo-template' -- README.md '*.tf' || true)
          if [ -n "$selfrefs" ]; then
            echo "::error::template self-references remain (badges/links/example role still point at the template)"; echo "$selfrefs"; fail=1
          fi
          exit $fail
